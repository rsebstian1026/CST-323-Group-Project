<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .detail-row {
            margin: 12px 0;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .label {
            font-weight: bold;
            color: #333;
        }

        .button-row {
            margin-top: 25px;
            text-align: center;
        }

        .btn {
            padding: 9px 15px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            margin: 3px;
            display: inline-block;
        }

        .btn-back {
            background-color: #777;
        }

        .btn-edit {
            background-color: #f9a825;
        }

        .btn-delete {
            background-color: #c62828;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Product Details</h1>

    <div class="detail-row">
        <span class="label">Product ID:</span>
        <span th:text="${product.productId}">1</span>
    </div>

    <div class="detail-row">
        <span class="label">Product Name:</span>
        <span th:text="${product.productName}">Sample Product</span>
    </div>

    <div class="detail-row">
        <span class="label">Category:</span>
        <span th:text="${product.category}">Category</span>
    </div>

    <div class="detail-row">
        <span class="label">Quantity:</span>
        <span th:text="${product.quantity}">10</span>
    </div>

    <div class="detail-row">
        <span class="label">Price:</span>
        <span th:text="${product.price}">9.99</span>
    </div>

    <div class="detail-row">
        <span class="label">Supplier:</span>
        <span th:text="${product.supplier}">Supplier</span>
    </div>

    <div class="detail-row">
        <span class="label">Description:</span>
        <span th:text="${product.description}">Description</span>
    </div>

    <div class="button-row">
        <a th:href="@{/products}" class="btn btn-back">Back to List</a>
        <a th:href="@{/products/edit/{id}(id=${product.productId})}" class="btn btn-edit">Edit</a>
        <a th:href="@{/products/delete/{id}(id=${product.productId})}"
           class="btn btn-delete"
           onclick="return confirm('Are you sure you want to delete this product?');">
            Delete
        </a>
    </div>
</div>

</body>
</html>
