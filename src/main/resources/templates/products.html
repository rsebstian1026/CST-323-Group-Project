<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory Product List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .btn {
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            margin-right: 5px;
        }

        .btn-add {
            background-color: #2e7d32;
        }

        .btn-view {
            background-color: #1976d2;
        }

        .btn-edit {
            background-color: #f9a825;
        }

        .btn-delete {
            background-color: #c62828;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #333;
            color: white;
            padding: 10px;
        }

        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .empty-message {
            text-align: center;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Inventory Product List</h1>

    <div class="top-bar">
        <a class="btn btn-add" th:href="@{/products/add}">Add Product</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Supplier</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.productId}">1</td>
            <td th:text="${product.productName}">Sample Product</td>
            <td th:text="${product.category}">Category</td>
            <td th:text="${product.quantity}">10</td>
            <td th:text="${product.price}">9.99</td>
            <td th:text="${product.supplier}">Supplier</td>
            <td>
                <a class="btn btn-view" th:href="@{/products/details/{id}(id=${product.productId})}">View</a>
                <a class="btn btn-edit" th:href="@{/products/edit/{id}(id=${product.productId})}">Edit</a>
                <a class="btn btn-delete" th:href="@{/products/delete/{id}(id=${product.productId})}"
                   onclick="return confirm('Are you sure you want to delete this product?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="empty-message" th:if="${#lists.isEmpty(products)}">
        No products have been added yet.
    </p>
</div>

</body>
</html>
